        <p>Every Sri Lankan resident aged 18 or over must register for a Taxpayer Identification Number (TIN). Registration is free at <a href="https://www.ird.gov.lk">ird.gov.lk</a>. Having a TIN does not mean you must pay tax — income tax applies only above Rs. 1.8 million a year.</p>
